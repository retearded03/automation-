# Konfigurasi utama yt-autopilot. Semua kredensial TIDAK ditaruh di sini,
# melainkan lewat GitHub Secrets / environment variable.

channel:
  name: "Built Curious"
  niche: >-
    Weird but true facts: bizarre inventions, strange engineering, odd places, counterintuitive
    science and surprising stories behind everyday objects - each one a "wait, what?" moment,
    explained in under 35 seconds and backed by sources
  language: "en"
  audience: "English-speaking viewers, primarily in the United States"
  category_id: "27"          # 27 = Education, 28 = Science & Technology
  fallback_visual_keywords: ["engineering", "machinery", "factory", "construction site", "technology"]

trends:
  regions: ["US", "GB", "CA", "AU"]
  category_ids: ["28", "27", "2"]   # Sains & Teknologi, Pendidikan, Otomotif
  include_general_chart: true
  max_results_per_chart: 50
  # Dibuang sebelum dikirim ke LLM: Film, Musik, Olahraga, Gaming, Entertainment,
  # Berita & Politik, Movies, Shows, Trailers
  blocked_category_ids: ["1", "10", "17", "20", "24", "25", "30", "43", "44"]
  max_trends_for_llm: 60

schedule:
  videos_per_day: 1                # mulai 1/hari sampai stabil, baru dinaikkan
  timezone: "America/New_York"
  # Satu slot per video, jam lokal di timezone di atas.
  publish_slots: ["08:00", "12:00", "15:00", "18:00", "21:00"]
  min_lead_minutes: 20

upload:
  # scheduled = private + publishAt (YouTube yang menayangkan di jam slot)
  # private | unlisted | public = langsung dengan status tersebut
  privacy_status: "scheduled"
  # Footage stok asli + narator TTS generik (tidak meniru orang nyata) dan tanpa
  # visual realistis buatan AI -> tidak termasuk "altered or synthetic content".
  # Ubah ke true kalau kamu menambahkan visual/suara realistis buatan AI.
  contains_synthetic_media: false
  made_for_kids: false
  set_thumbnail: true
  notify_subscribers: true

format:
  width: 1080
  height: 1920
  fps: 30
  max_seconds: 35                    # rata-rata durasi tonton Shorts ~16 detik: makin pendek makin baik
  min_seconds: 15
  target_words: 80

llm:
  # gemini = gratis (key dari aistudio.google.com) | claude = berbayar (key dari console.anthropic.com)
  # LLM_API_KEY harus sesuai provider yang dipilih.
  provider: "gemini"
  # Model per langkah. Pilihan: claude-opus-5-5 (terbaik, termahal), claude-sonnet-5-5 (seimbang),
  # claude-haiku-5-5 (sangat murah). effort: low | medium | high | xhigh | max (lebih tinggi = lebih teliti & mahal)
  claude_steps:
    topic_picker:  {model: "claude-sonnet-5-5", effort: "medium"}   # 1x/hari: keamanan & orisinalitas topik
    script_writer: {model: "claude-sonnet-5-5", effort: "medium"}   # kualitas tulisan paling menentukan
    fact_check:    {model: "claude-haiku-5-5",  effort: "medium"}   # cocokkan klaim dengan kutipan sumber
    quality_gate:  {model: "claude-haiku-5-5",  effort: "low"}      # beri skor naskah
  # Dipakai untuk langkah yang tidak tercantum di atas
  claude_model: "claude-sonnet-5-5"
  claude_effort: "medium"
  gemini_model: "gemini-flash-latest"
  # Dipakai otomatis kalau model utama terus overload (503), kena rate limit (429), atau tidak ada (404)
  gemini_fallback_models: ["gemini-flash-lite-latest", "gemini-3.8-flash"]
  # Free tier sering overload (503). Kalau semua model sibuk: tunggu lalu ulangi satu putaran penuh.
  gemini_rounds: 1                   # 1 putaran, lalu pindah ke fallback_providers (naikkan kalau tanpa cadangan)
  gemini_round_wait: 90              # detik; jeda naik tiap putaran (90, 180, ...)
  temperature: 0.9                   # hanya untuk Gemini
  # Cadangan berformat OpenAI, dicoba berurutan kalau semua model Gemini gagal.
  # Yang secret-nya belum diisi otomatis dilewati. Hapus baris yang promonya sudah habis.
  fallback_providers:
    - {name: "centai", base_url: "https://api.cent-ai.dev/v1", model: "hy4-flash:free", key_env: "CENTAI_API_KEY"}      # gratis s/d 30 Nov 2026
    - {name: "centai", base_url: "https://api.cent-ai.dev/v1", model: "glm-5.3-flash:free", key_env: "CENTAI_API_KEY"}  # kuota harian bersama
    - {name: "groq", base_url: "https://api.groq.com/openai/v1", model: "openai/gpt-oss-120b", key_env: "GROQ_API_KEY"}  # opsional

script:
  min_quality_score: 7
  min_segments: 4
  max_segments: 7
  sources_per_video: 3
  max_source_chars: 6000
  max_attempts: 3
  # draf terbaik tetap dipakai (dengan peringatan di Telegram) kalau skornya minimal segini
  min_acceptable_score: 5

voice:
  voices:
    - "en-US-AndrewNeural"
    - "en-US-ChristopherNeural"
    - "en-US-AriaNeural"
    - "en-GB-RyanNeural"
    - "en-US-EmmaNeural"
  base_rate_percent: 10
  max_rate_percent: 25

visuals:
  # ai_image = ilustrasi AI bergaya animasi 3D per adegan (footage stok jadi cadangan)
  # stock    = footage Pixabay/Pexels saja
  mode: "ai_image"
  # gemini_image memakai gambar referensi maskot (paling konsisten); cloudflare butuh CF_ACCOUNT_ID + CF_API_TOKEN
  ai_providers: ["gemini_image", "cloudflare", "pollinations"]
  gemini_image_models: ["gemini-2.5-flash-image"]   # dicoba duluan; model gambar lain dicari otomatis
  # Maskot orisinal channel, muncul di setiap adegan. Gambar referensinya disimpan otomatis di
  # assets/character/mascot.png pada run pertama; ganti file itu kalau ingin maskot lain.
  character: "a small round friendly robot with a glossy cream-white body, a big curved dark visor face showing two glowing cyan oval eyes, short stubby arms and legs, and a tiny orange antenna on top"
  background: "Plain solid soft pastel peach background, simple minimal set, soft studio lighting"
  cloudflare_model: "@cf/black-forest-labs/flux-1-schnell"
  # Dicoba berurutan; provider tanpa API key otomatis dilewati (cukup salah satu key).
  providers: ["pexels", "pixabay"]
  seconds_per_shot: 1.8             # ganti gambar tiap ~1,8 detik supaya penonton tidak swipe
  max_shots_per_segment: 4
  avoid_reuse_days: 60
  max_download_mb: 80

music:
  folder: "assets/music"
  volume_db: -16

fonts:
  folder: "assets/fonts"

styles:
  avoid_recent_combinations: 15
  hook_types:
    - "surprising number: open with a startling statistic from the sources"
    - "direct question the viewer has never thought to ask"
    - "myth vs fact: state a common belief, then flip it"
    - "imagine scenario: put the viewer inside the situation"
    - "counterintuitive claim stated bluntly in one short line"
  structures:
    - "step-by-step process: walk through how it works in order"
    - "problem then clever solution: the obstacle engineers faced and how they beat it"
    - "comparison: contrast it with something familiar to make scale tangible"
    - "countdown of 3 facts, building to the most surprising one"
    - "mini story: a concrete moment that reveals how the thing works"
  caption_styles:
    - {name: "punch_yellow", font: "Roboto", size: 92, primary: "#FFFFFF", highlight: "#FFD400", outline: "#000000", outline_width: 7, words: 2, uppercase: true, y: 0.62, pop: true}
    - {name: "clean_white", font: "Roboto", size: 80, primary: "#FFFFFF", highlight: "#4FD1FF", outline: "#101010", outline_width: 5, words: 3, uppercase: false, y: 0.72, pop: false}
    - {name: "boxed_green", font: "DejaVu Sans", size: 78, primary: "#FFFFFF", highlight: "#7CFF6B", outline: "#000000", outline_width: 4, words: 3, uppercase: true, y: 0.55, pop: true, box: true}
    - {name: "single_word", font: "Roboto", size: 118, primary: "#FFFFFF", highlight: "#FF7A1A", outline: "#000000", outline_width: 8, words: 1, uppercase: true, y: 0.5, pop: true}
  palettes:
    - {name: "safety", accent: "#FFD400", text: "#111111", shade: "#000000"}
    - {name: "electric", accent: "#2EC4FF", text: "#FFFFFF", shade: "#001A33"}
    - {name: "lava", accent: "#FF5A1F", text: "#FFFFFF", shade: "#1A0500"}
    - {name: "mint", accent: "#5BFFB0", text: "#0B0B0B", shade: "#00140A"}
  thumbnail_layouts: ["top_band", "bottom_band", "center_outline", "corner_tag"]
  hook_overlay: [true]               # teks hook besar selalu muncul di frame pertama

notify:
  telegram: true
  send_video_on_dry_run: true

paths:
  work_dir: "work"
  history_file: "history.json"
